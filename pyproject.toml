[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "folio-verify"
version = "0.1.0"
description = "Auditable invoice extraction and human review"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
  "python-multipart>=0.0.20,<1", "pymupdf>=1.25,<2", "pillow>=11,<13",
  "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
demo = ["reportlab>=5,<6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
